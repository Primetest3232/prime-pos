<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Prime POS – Testkasse</title><style>body{font-family:system-ui;background:#111;color:#fff;margin:0;padding:18px}h1{color:#ffca28;margin-bottom:0}small{color:#aaa}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}button{border:0;border-radius:12px;padding:16px 10px;font-size:16px;font-weight:700;background:#ffc928;color:#111}button:active{opacity:.7}.panel{background:#242424;border-radius:14px;padding:15px;margin-top:16px}.line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #444}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.muted{background:#444;color:white}.danger{background:#b93636;color:white}#status{color:#ffcc44;font-size:13px}</style></head><body><h1>PRIME POS</h1><small>Prime Streetfood Siegen · DEMO / keine Fiskalkasse</small><div class="grid" id="products"></div><div class="panel"><h2>Aktuelle Bestellung</h2><div id="cart">Noch keine Artikel</div><h2 id="total">0,00 €</h2><div class="actions"><button onclick="checkout('Bar')">Bar (Demo)</button><button onclick="checkout('Karte')">Karte (Demo)</button><button class="muted" onclick="clearCart()">Leeren</button></div></div><div class="panel"><h2>Tagesübersicht (Demo)</h2><div id="summary"></div><button class="danger" onclick="resetDay()">Testdaten löschen</button><p id="status">Testversion: keine TSE, keine Belege, keine echte Zahlungsabwicklung. Nicht für reale Verkäufe verwenden.</p></div><script>const items=[['Steak Döner',10.5],['Döner Menü',15],['Steak Döner Bowl',14],['Pommes',4],['Kids Bowl',7],['Chicken Menü',11],['Nuggets',3.5],['Chicken Sticks',3.5],['Getränk',2.5]];const money=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});let cart=[];let sales=JSON.parse(localStorage.getItem('prime-demo-sales')||'[]');let day=localStorage.getItem('prime-demo-day');let today=new Date().toLocaleDateString('sv-SE');if(day!==today){sales=[];localStorage.setItem('prime-demo-day',today);localStorage.setItem('prime-demo-sales','[]')}document.getElementById('products').innerHTML=items.map((x,i)=>`<button onclick="add(${i})">${x[0]}<br>${money(x[1])}</button>`).join('');function add(i){cart.push(i);render()}function clearCart(){cart=[];render()}function render(){let total=cart.reduce((s,i)=>s+items[i][1],0);document.getElementById('cart').innerHTML=cart.length?cart.map((i,n)=>`<div class="line"><span>${items[i][0]}</span><span>${money(items[i][1])} <button class="muted" style="padding:4px 8px" onclick="cart.splice(${n},1);render()">×</button></span></div>`).join(''):'Noch keine Artikel';document.getElementById('total').textContent=money(total);document.getElementById('summary').textContent=`${sales.length} Testbestellungen · ${money(sales.reduce((s,x)=>s+x.total,0))}`;}function checkout(type){if(!cart.length)return alert('Bitte zuerst Artikel auswählen.');let total=cart.reduce((s,i)=>s+items[i][1],0);if(!confirm(`TESTBUCHUNG ${type}: ${money(total)}? Keine echte Zahlung.`))return;sales.push({total,type,at:new Date().toISOString()});localStorage.setItem('prime-demo-sales',JSON.stringify(sales));cart=[];render()}function resetDay(){if(confirm('Alle lokalen Testbuchungen löschen?')){sales=[];localStorage.setItem('prime-demo-sales','[]');render()}}render();</script></body></html>
